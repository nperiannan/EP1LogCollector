# Global Configuration
username: nperiannan
environment: dl2r1

# Bastion Server Configuration
bastion:
  host: usnc-awsgtwy-02.extremenetworks.com
  port: 22
  password: ""                   # Leave empty - tool will prompt and encrypt
  # keyPath: "C:\\Users\\{username}\\.ssh\\id_ed25519_bastion"    # Optional: SSH private key (e.g., ~/.ssh/id_rsa)

# AWS Server Configuration
aws:
  host: "{environment}-console.qa.xcloudiq.com"
  keyPath: ~/.ssh/id_ed25519_26Q1

# Log File Configuration
logs:
  pattern: /home/{username}/*.gz
  outputDir: C:\Logs

# General Options
options:
  autoRetry: true
  numChunks: 8                      # Number of parallel download connections (1-10, default: 8)
  logLevel: INFO
  maxSSHSessions: 2                # Maximum concurrent SSH sessions per source (1-4, default: 1)
  downloadMethod: "scp"             # Download method: "scp" (native SCP, 10x faster) or "sftp" (parallel SFTP). Default: scp

# Kubernetes Log Collection Settings
logCollection:
  enabled: false                     # Enable/disable log collection
  logFileName: app_log
  tempDir: "{environment}_{username}_templogs"
  useTimestamp: true
  deleteAfterCopy: true
  autoDeleteTempDir: true            # Auto-delete existing tempDir without prompting (false = prompt user)
  timestampFormat: "20060102_150405"
  customSources: []
  # Time-based log collection (collect logs from last X time)
  timeBasedCollection:
    enabled: true                   # Enable time-based collection (false = collect full logs)
    duration: ""                 # Duration like "15m", "30m", "1h", "2h" (leave empty for full logs)
  # Temporal workflow information collection
  # Reference: https://extremenetworks.atlassian.net/wiki/spaces/NCM/pages/371756102/Temporal+Cheat+Sheet
  temporalWorkflowCollection:
    enabled: true                   # Enable/disable temporal workflow data collection
    workflowIdPrefix: ""            # Filter workflows by ID prefix (empty = all workflows)
    numberOfWorkflows: 3            # Number of recent workflows to collect (1-20, default 3)
    namespace: "configuration"      # Temporal namespace to query
  # Temporal schedule information collection
  temporalScheduleCollection:
    enabled: true                   # Enable/disable temporal schedule data collection
    numberOfSchedules: 5            # Number of recent schedules to collect (1-20, default 5)
    namespace: "configuration"      # Temporal namespace to query
  # Log analysis and error detection
  logAnalysis:
    enabled: false                  # Enable automatic log analysis for errors/issues
    outputFile: "log_analysis_summary.txt"  # Output file name for analysis results
    errorPatterns:                  # Patterns to search for in collected logs (case-insensitive)
      - "error"
      - "panic"
      - "failure"
      - "failed"
      - "exception"
      - "fatal"
      - "critical"
      - "timeout"
      - "connection refused"
      - "unable to"
      - "cannot"
      - "permission denied"
    excludeKeywords:                # Lines containing these keywords are excluded (false positive filtering)
      - "ErrorLogLocation"
      - "ErrorFileLogSize"
      - "ServiceErrorFileLogSize"
      - "\"level\":\"info\""
      - "\"level\":\"debug\""
      - "error_count=0"
      - "errors=0"
    maxMatches: 20                  # Maximum matches per log file to include in summary
    contextLines: 2                 # Number of lines before/after each match to include
  # Post-download message filtering (creates filtered copies in filter/ directory)
  messageFilter:
    enabled: false                  # Enable/disable message filtering
    keyValueFilters:                # Keep lines where key is absent OR key has matching value
      - key: "ownerID"
        value: "1096"
      - key: "serial"
        value: ""
    specificStrings: []             # Only keep lines containing at least one of these strings (empty = no filter)
  # Pod file collection (collect specific files from inside pods)
  podFileCollection:
    enabled: true                  # Enable/disable pod file collection
    collections:                    # List of pod file collection configurations
      - namespace: "common"         # Kubernetes namespace
        podPrefix: "cs-configuration"  # Pod name prefix to match
        logPath: "/var/log/configuration/"  # Path inside the pod
        filePatterns:               # File patterns to collect (supports wildcards)
          - "*.log"                 # ALL .log files (server.log, error.log, etc.)
        # Wildcard Pattern Examples:
        #   "*.log"          → All files ending with .log
        #   "server*"        → All files starting with "server" (server.log, server_err.log)
        #   "*error*"        → All files containing "error" in the name
        #   "application*.log" → Files like application.log, application-2024.log
        #   "*"              → ALL files (use carefully - might be too many!)
        #   "server.log"     → Exact filename match (no wildcard)
        #   ".log.gz"       → All files ending with .log.gz
        #   "2024-*.log"     → All .log files starting with "2024-" (e.g., 2024-01.log, 2024-02.log)
        #   "2024-??-??.log" → All .log files with date format (e.g., 2024-01-15.log, 2024-02-20.log)
        #   "2024-0[1-2]-??.log" → All .log files from Jan and Feb 2024 (e.g., 2024-01-15.log, 2024-02-20.log)
        #   "2024-*-??.log" → All .log files from 2024 (e.g., 2024-01-15.log, 2024-02-20.log, 2024-03-10.log)
      # Example: Add more collections as needed
      # - namespace: "xiq"
      #   podPrefix: "hmweb"
      #   logPath: "/opt/app/logs/"
      #   filePatterns:
      #     - "*.log"
      #     - "application*.log"
      #     - "*.log.gz"
# General System Information Collection
generalInfo:
  enabled: false
  outputDir: "General"
  commands:
    - name: "nodes_detailed"
      command: "kubectl get nodes -o wide"
      description: "Get nodes with detailed information"
    - name: "pods_current_namespace"
      command: "kubectl get pods -n {environment} -o wide"
      description: "Get pods in current environment namespace"
    - name: "node_memory_cpu_info"
      command: "kubectl get nodes -o custom-columns=NAME:.metadata.name,CPU:.status.capacity.cpu,MEMORY:.status.capacity.memory"
      description: "CPU and memory information of each node"
    - name: "pods_all_namespaces"
      command: "kubectl get pods --all-namespaces -o wide"
      description: "Get pods in all namespaces"
    - name: "nodes_cpu_usage"
      command: "kubectl top node --sort-by=cpu"
      description: "Get nodes with high CPU usage"
    - name: "node_memory_usage"
      command: "kubectl top node --sort-by=memory"
      description: "Get nodes with high memory usage"
    - name: "pods_cpu_memory_usage"
      command: "kubectl top pod --all-namespaces --containers"
      description: "Get pods with top cpu"

# App Version Collection Settings
appVersionCollection:
  enabled: true                     # Enable/disable app version collection
  outputFileName: "{environment}_app_versions_{timestamp}.txt"  # Output file name for version information
  printToLog: true                  # Print version information to console/log output
  namespaces:                       # Namespaces and pod prefixes to check for versions
    - namespace: "common"
      description: "Common services namespace"
      podPrefixes: ["cas-api-service", "cls-api-service", "cns-api-service", "cs-configstate", "cs-configuration", "cs-metaflow-cacheupdater", "cs-tagging", "common-kafka", "temporal", "device-connector"]
    - namespace: "{environment}"     # Dynamic: uses 'xiq' if the namespace exists, otherwise environment name (e.g., dl2r1)
      description: "Environment-specific services (XIQ namespace)"
      podPrefixes: ["hmweb", "teconfig", "copilot-flink", "default-kafka"]
    - namespace: "nvo"
      description: "NVO services namespace"
      podPrefixes: ["nvo-edge", "nvo-network"]

